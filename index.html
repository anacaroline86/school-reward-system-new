<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link  href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <title>Sistema de Recompensa Escolar</title>
</head>
<body>
   <header class="cabecalho">
        <div class="cabecalho-marca">
            <h1 class="nome-marca">Recompensa Escolar</h1>
            <p class="subtitulo-marca">Notas viram recompensa. Cada bimestre conta.</p>
        </div>

        <div class="cabecalho-bimestre">
            <select id="select-bimestre" hidden>
                <option value="primeiro">1º Bimestre</option>
                <option value="segundo">2º Bimestre</option>
                <option value="terceiro">3º Bimestre</option>
                <option value="quarto">4º Bimestre</option>
            </select>
            <p id="titulo-bimestre" class="pill-status">1º Bimestre</p>
        </div>
   </header>

   <nav class="abas-bimestre">
        <button type="button" class="aba-bimestre ativa" data-bimestre="primeiro">1º Bimestre</button>
        <button type="button" class="aba-bimestre" data-bimestre="segundo">2º Bimestre</button>
        <button type="button" class="aba-bimestre" data-bimestre="terceiro">3º Bimestre</button>
        <button type="button" class="aba-bimestre " data-bimestre="quarto">4º Bimestre</button>
   </nav>

    <section class="secao">
        <h2>Configurações - matérias</h2>
        <label for="nova-materia">Nome da matéria:</label>
        <input type="text" id="nova-materia">
        <button id="botao-adicionar-materia">Adicionar matéria</button>
        <p id="mensagem-materia"></p>
    </section>

    <div class="conteudo-bimestre">
        <section class="secao secao-notas">
            <h2>Notas Bimestre</h2>
            <div id="lista-notas-materias"></div>
            <button id="botao-calcular">Calcular bimestre</button>
            <p id="mensagem-validacao"></p>
        </section>


        <section  class="secao secao-resultado">
            <p class="rotulo-resultado">Valor do bimestre</p>
            <p id="valor-bimestre"></p>
            <p id="lista-valores"></p>
            <p id="total-positivo"></p>
            <p id="total-desconto"></p>

            <p id="status-bimestre">Status: Aberto</p>
            <p id="data-fechamento"></p>
            <p id="status-pagamento">Pagamento: -</p>
            <p id="data-pagamento"></p>

            <div class="acoes-bimestre">
                <button id="botao-fechar">Fechar bimestre</button>
                <button id="botao-pagar">Marcar como pago</button>
            </div>
        </section>
    </div>

    <section class="secao">
        <label for="config-valor-10">Nota 10:</label>
        <input type="number" id="config-valor-10" step="1">

        <label for="config-valor-9">Nota 9:</label>
        <input type="number" id="config-valor-9" step="1">

        <label for="config-valor-8">Nota 8:</label>
        <input type="number" id="config-valor-8" step="1">

        <label for="config-valor-7">Nota 7:</label>
        <input type="number" id="config-valor-7" step="1">

        <label for="config-valor-6">Nota 6:</label>
        <input type="number" id="config-valor-6" step="1">

        <label for="config-valor-5">Nota 5:</label>
        <input type="number" id="config-valor-5" step="1">

        <button id="botao-salvar-valores">Salvar valores</button>
        <p id="mensagem-config"></p>
    </section>

    <section class="secao">
        <h2>Resumo do bimestre</h2>
        <p id="dashboard-notas-cadastradas"></p>
        <p id="dashboard-notas-acima"></p>
        <p id="dashboard-notas-abaixo"></p>

        <h2>Resumo do ano</h2>
        <p id="dashboard-primeiro"></p>
        <p id="dashboard-segundo"></p>
        <p id="dashboard-terceiro"></p>
        <p id="dashboard-quarto"></p>
        <p id="dashboard-total-pago"></p>
    </section>

    <button id="botao-resetar">Zerar todos os dados</button>

    <script src="js/calculadora.js"></script>
</body>
</html>
