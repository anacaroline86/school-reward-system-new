<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Recompensa Escolar</title>
</head>
<body>
    <label for="select-bimestre">Bimestre:</label>
    <select id="select-bimestre">
        <option value="primeiro">1º Bimestre</option>
        <option value="segundo">2º Bimestre</option>
        <option value="terceiro">3º Bimestre</option>
        <option value="quarto">4º Bimestre</option>
    </select>
    <h1 id="titulo-bimestre">1º Bimestre</h1>
    <label for="notaportugues">Português:</label>
    <input type="number" id="notaportugues" min="0" max="10" step="0.1">
    <label for="notamatematica">Matemática:</label>
    <input type="number" id="notamatematica" min="0" max="10" step="0.1">
    <label for="notahistoria">História:</label>
    <input type="number" id="notahistoria" min="0" max="10" step="0.1">
    <label for="notageografia">Geografia:</label>
    <input type="number" id="notageografia" min="0" max="10" step="0.1">
    <label for="notaciencias">Ciências:</label>
    <input type="number" id="notaciencias" min="0" max="10" step="0.1">
    <label for="notaingles">Inglês:</label>
    <input type="number" id="notaingles" min="0" max="10" step="0.1">
    <label for="notaedfisica">Educação Física:</label>
    <input type="number" id="notaedfisica" min="0" max="10" step="0.1">
    <label for="notaartes">Artes:</label>
    <input type="number" id="notaartes" min="0" max="10" step="0.1">
    <button id="botao-calcular">Calcular bimestre</button>
    <button id="botao-fechar">Fechar bimestre</button>
    <button id="botao-pagar">Marcar como pago</button>
    <p id="status-pagamento">Pagamento: -</p>
    <p id="data-pagamento"></p>
    <p id="status-bimestre">Status: Aberto</p>
    <p id="data-fechamento"></p>
    <p id="lista-valores"></p>
    <p id="total-positivo"></p>
    <p id="total-desconto"></p>
    <p id="valor-bimestre"></p>
    <script src="js/calculadora.js"></script>
</body>
</html>
